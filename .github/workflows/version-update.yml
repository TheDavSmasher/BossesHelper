name: Update latest Release Version

on:
  workflow_dispatch:
    inputs:
      update:
        description: 'Type of update'
        required: true
        type: choice
        options:
          - patch
          - minor
          - Major
        default: patch

jobs:
  version_update:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repo
      uses: actions/checkout@v5

    - name: Get last version
      id: last_version
      run: |
        LAST_VERSION=$(yq e '.[0].Version' everest.yaml)
        echo $LAST_VERSION
        echo "last_version=$LAST_VERSION" >> $GITHUB_OUTPUT
    
    - name: Get new version
      id: new_version
      run: |
        IFS='.' read -ra PARTS <<< ${{ steps.last_version.outputs.last_version }}
        case ${{ inputs.update }} in
          patch)
            ((PARTS[2]++))
            ;;
          minor)
            ((PARTS[1]++))
            PARTS[2]=0
            ;;
          Major)
            ((PARTS[0]++))
            PARTS[1]=0
            PARTS[2]=0
            ;;
        esac
        for part in ${PARTS[@]}; do
          echo $part
        done
        echo "Doing a ${{ inputs.update }} update."
      